<script>
function toggleTheme(){
    const current = document.documentElement.getAttribute('data-theme') || 'dark';
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('gboc-theme', next);
    updateThemeButton(next);
}
function updateThemeButton(theme){
    const icon = document.getElementById('themeIcon');
    const label = document.getElementById('themeLabel');
    if(icon && label){
        icon.className = theme === 'dark' ? 'fas fa-moon' : 'fas fa-sun';
        label.textContent = theme === 'dark' ? 'Tema Escuro' : 'Tema Claro';
    }
}
function gbocSetupSidebarAuth(){
    // Se há token no localStorage, sempre mostrar botão logout
    const token = localStorage.getItem('gboc_token');
    const user = localStorage.getItem('gboc_user');
    if(user){
        try {
            const u = JSON.parse(user);
            _gbocShowSidebarUser(u);
        } catch(e){}
    } else if(token){
        // Tem token mas não tem user — mostrar logout mesmo assim
        const btn = document.getElementById('logoutBtn');
        if(btn) btn.style.display = 'block';
    }
    // Consulta a API para confirmar status
    fetch('/api/auth/status').then(r => r.json()).then(data => {
        if(data.authenticated && data.user){
            _gbocShowSidebarUser(data.user);
        } else if(data.auth_enabled){
            // Auth habilitado mas não autenticado — mostrar logout para redirecionar ao login
            const btn = document.getElementById('logoutBtn');
            if(btn) btn.style.display = 'block';
        }
    }).catch(()=>{
        // Se API falhar e há token, manter botão visível
        if(token){
            const btn = document.getElementById('logoutBtn');
            if(btn) btn.style.display = 'block';
        }
    });
}
function _gbocShowSidebarUser(u){
    const el = document.getElementById('sidebarUsername');
    const info = document.getElementById('sidebarUserInfo');
    const btn = document.getElementById('logoutBtn');
    if(el) el.textContent = u.display_name || u.username || '';
    if(info) info.style.display = 'block';
    if(btn) btn.style.display = 'block';
}
async function gbocLogout(){
    if(!confirm('Deseja realmente sair?')) return;
    try {
        await fetch('/api/auth/logout', {method:'POST'});
    } catch(e){}
    localStorage.removeItem('gboc_token');
    localStorage.removeItem('gboc_user');
    document.cookie = 'gboc_token=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
    window.location.href = '/login.html';
}
(function(){
    const saved = localStorage.getItem('gboc-theme') || 'dark';
    document.documentElement.setAttribute('data-theme', saved);
    // Executar setup de auth imediatamente (o DOM do sidebar já está pronto quando o script executa via insertAdjacentHTML)
    // Aguardar um tick para garantir que os elementos já estão no DOM
    setTimeout(gbocSetupSidebarAuth, 0);
})();
</script>
