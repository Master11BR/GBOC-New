<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GBOC Agent 13.2.0 - Integrity Checks</title>
    <link rel="stylesheet" href="/static/style.css?v=13.2.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/static/auth_interceptor.js"></script>
    <style>
        .stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:22px}
        .stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:10px;padding:16px;text-align:center}
        .stat-card .val{font-size:1.6em;font-weight:700}.stat-card .lbl{font-size:.82em;color:var(--text-muted)}
        .panel{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:18px}
        .panel-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
        .panel-body{padding:14px 18px}
        .tbl{width:100%;border-collapse:collapse}.tbl th,.tbl td{padding:9px 10px;border-bottom:1px solid var(--border);font-size:.84em;text-align:left}
        .tbl th{background:var(--bg-input);color:var(--text-muted)}
        .badge-ok{background:rgba(78,203,136,.15);color:var(--success);padding:2px 10px;border-radius:20px;font-size:.8em}
        .badge-crit{background:rgba(240,107,107,.15);color:var(--danger);padding:2px 10px;border-radius:20px;font-size:.8em}
        .badge-warn{background:rgba(240,169,64,.15);color:var(--warning);padding:2px 10px;border-radius:20px;font-size:.8em}
    </style>
</head>
<body>
<div class="app">
<main class="main-content">
    <header class="header">
        <div>
            <h1 class="page-title"><i class="fas fa-check-double" style="color:var(--success)"></i> Integrity Checks</h1>
            <div class="page-subtitle">Validação de integridade dos repositórios e histórico de verificações</div>
        </div>
        <div class="header-actions">
            <button class="btn btn-secondary" onclick="loadAll()"><i class="fas fa-sync-alt"></i> Atualizar</button>
        </div>
    </header>

    <div class="stats-row">
        <div class="stat-card"><div class="val" id="kpi-total">0</div><div class="lbl">Checks no Histórico</div></div>
        <div class="stat-card"><div class="val" id="kpi-ok" style="color:var(--success)">0</div><div class="lbl">OK</div></div>
        <div class="stat-card"><div class="val" id="kpi-fail" style="color:var(--danger)">0</div><div class="lbl">Falhas</div></div>
        <div class="stat-card"><div class="val" id="kpi-running" style="color:var(--warning)">0</div><div class="lbl">Em Execução</div></div>
    </div>

    <div class="panel">
        <div class="panel-header"><h3><i class="fas fa-server"></i> Repositórios</h3></div>
        <div class="panel-body" style="padding:0">
            <table class="tbl">
                <thead><tr><th>ID</th><th>Nome</th><th>Engine</th><th>Tipo</th><th>Status</th><th>Ações</th></tr></thead>
                <tbody id="repos-table"><tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:20px">Carregando...</td></tr></tbody>
            </table>
        </div>
    </div>

    <div class="panel">
        <div class="panel-header"><h3><i class="fas fa-history"></i> Histórico de Integrity Check</h3></div>
        <div class="panel-body" style="padding:0">
            <table class="tbl">
                <thead><tr><th>ID</th><th>Repo</th><th>Status</th><th>Início</th><th>Fim</th><th>Erros</th><th>Detalhe</th></tr></thead>
                <tbody id="hist-table"><tr><td colspan="7" style="text-align:center;color:var(--text-muted);padding:20px">Carregando...</td></tr></tbody>
            </table>
        </div>
    </div>

</main>
</div>
<script src="/static/sidebar.js"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{new UnifiedSidebar().initialize();loadAll()});

async function loadAll(){ await Promise.allSettled([loadRepos(), loadHistory(), loadStatusAll()]); }

async function loadRepos(){
  try{
    const r=await fetch('/api/repositories/');
    const d=await r.json();
    const repos = Array.isArray(d) ? d : (d.repositories || []);
    const tb=document.getElementById('repos-table');
    if(!repos.length){tb.innerHTML='<tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:20px">Nenhum repositório</td></tr>';return}
    tb.innerHTML=repos.map(x=>`<tr>
      <td>${x.id}</td><td><strong>${x.name||'—'}</strong></td><td>${x.engine||'—'}</td><td>${x.type||'—'}</td>
      <td><span class="badge-warn" id="repo-st-${x.id}">N/A</span></td>
      <td><button class="btn btn-sm btn-primary" onclick="runCheck(${x.id})"><i class="fas fa-play"></i> Check</button>
          <button class="btn btn-sm btn-secondary" onclick="checkStatus(${x.id})"><i class="fas fa-search"></i> Status</button></td>
    </tr>`).join('');
  }catch(e){
    console.error(e);
    const tb=document.getElementById('repos-table');
    if(tb) tb.innerHTML='<tr><td colspan="6" style="text-align:center;color:var(--danger);padding:20px">Erro ao carregar repositórios</td></tr>';
  }
}

async function runCheck(repoId){
  try{
    const r=await fetch(`/api/integrity/check/${repoId}`,{method:'POST'});
    const d=await r.json();
    if(!r.ok){ alert(d.detail||d.message||'Falha ao iniciar check'); return; }
    alert(d.message||'Check iniciado');
    // polling curto para refletir status em tela
    let tries=0;
    const iv=setInterval(async()=>{
      tries++;
      await checkStatus(repoId);
      if(tries>=10){ clearInterval(iv); loadHistory(); loadStatusAll(); }
    },1500);
  }catch(e){alert('Erro: '+e.message)}
}

async function checkStatus(repoId){
  try{
    const r=await fetch(`/api/integrity/check/${repoId}/status`);
    const d=await r.json();
    const el=document.getElementById(`repo-st-${repoId}`); if(!el) return;

    const check = d.check || {};
    const st=(check.status||'idle').toLowerCase();

    if(st==='passed' || st==='success' || st==='completed'){ el.className='badge-ok'; el.textContent='OK'; }
    else if(st==='failed' || st==='error'){
      el.className='badge-crit';
      const msg = check.result_summary || 'FALHA';
      el.textContent = `FALHA: ${String(msg).slice(0, 40)}`;
    }
    else if(st==='running'){ el.className='badge-warn'; el.textContent='EXECUTANDO'; }
    else { el.className='badge-warn'; el.textContent='IDLE'; }

  }catch(e){console.error(e)}
}

async function loadHistory(){
  try{
    const r=await fetch('/api/integrity/history'); const d=await r.json();
    const items=d.history||[];
    document.getElementById('kpi-total').textContent=items.length;

    const ok=items.filter(x=>['passed','success','completed'].includes(String((x.display_status||x.status)||'').toLowerCase())).length;
    const fail=items.filter(x=>['failed','error'].includes(String((x.display_status||x.status)||'').toLowerCase())).length;
    document.getElementById('kpi-ok').textContent=ok;
    document.getElementById('kpi-fail').textContent=fail;

    const tb=document.getElementById('hist-table');
    if(!items.length){tb.innerHTML='<tr><td colspan="7" style="text-align:center;color:var(--text-muted);padding:20px">Sem histórico</td></tr>';return}

    tb.innerHTML=items.map(x=>{
      const st = String((x.display_status || x.status) || '').toLowerCase();
      const isFail = ['failed','error'].includes(st);
      const label = isFail ? 'FALHA' : (st === 'warning' ? 'ATENÇÃO' : 'OK');
      return `<tr>
        <td>${x.id||'—'}</td>
        <td>${x.repository_name||'—'}</td>
        <td>${label}</td>
        <td>${x.started_at?gbocFormatDateTime(x.started_at):'—'}</td>
        <td>${x.finished_at?gbocFormatDateTime(x.finished_at):'—'}</td>
        <td style="color:${Number(x.errors_found||0)>0?'var(--danger)':'var(--success)'}">${x.errors_found||0}</td>
        <td><button class="btn btn-sm btn-secondary" onclick="showIntegrityError(${x.id})"><i class="fas fa-circle-info"></i> Ver detalhe</button></td>
      </tr>`;
    }).join('');
  }catch(e){console.error(e)}
}

async function showIntegrityError(id){
  try{
    const r = await fetch(`/api/integrity/history/${id}`);
    const d = await r.json();
    if(!r.ok){
      alert(`Integrity #${id}\n\nNão foi possível carregar detalhes.`);
      return;
    }
    const it = d.detail || {};
    const txt = [
      `Integrity #${id}`,
      `Repositório: ${it.repository_name || '—'}`,
      `Engine: ${it.engine || '—'}`,
      `Status: ${it.check_status || '—'}`,
      `Início: ${it.started_at || '—'}`,
      `Fim: ${it.finished_at || '—'}`,
      `Erros: ${it.errors_found || 0}`,
      '',
      'Resumo:',
      it.result_summary || 'Sem resumo',
      '',
      'Saída completa:',
      it.raw_output || 'Sem saída detalhada'
    ].join('\n');
    alert(txt);
  }catch(e){
    alert(`Integrity #${id}\n\nErro ao carregar detalhe: ${e.message}`);
  }
}

async function loadStatusAll(){
  try{
    const r=await fetch('/api/integrity/status-all'); const d=await r.json();
    const checks=d.checks||{};
    const running=Object.values(checks).filter(x=>String(x.status||'').toLowerCase()==='running').length;
    document.getElementById('kpi-running').textContent=running;
  }catch(e){console.error(e)}
}
</script>
</body>
</html>
