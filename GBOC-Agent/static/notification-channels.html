<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GBOC Agent 11.7c - Notification Channels</title>
    <link rel="stylesheet" href="/static/style.css?v=11.9">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/static/auth_interceptor.js"></script>
    <style>
        .panel{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:16px}
        .panel-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
        .panel-body{padding:14px 18px}
        .tbl{width:100%;border-collapse:collapse}.tbl th,.tbl td{padding:9px 10px;border-bottom:1px solid var(--border);font-size:.84em;text-align:left}
        .tbl th{background:var(--bg-input);color:var(--text-muted)}
        .badge-ok{background:rgba(78,203,136,.15);color:var(--success);padding:2px 10px;border-radius:20px;font-size:.8em}
        .badge-warn{background:rgba(240,169,64,.15);color:var(--warning);padding:2px 10px;border-radius:20px;font-size:.8em}
        .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
        .form-group label{display:block;font-size:.82em;color:var(--text-muted);margin-bottom:5px}
        .form-group input,.form-group select,.form-group textarea{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:8px;background:var(--bg-input);color:var(--text)}
        @media(max-width:900px){.form-grid{grid-template-columns:1fr}}
    </style>
</head>
<body>
<div class="app">
<main class="main-content">
    <header class="header">
        <div>
            <h1 class="page-title"><i class="fas fa-bell" style="color:var(--warning)"></i> Notification Channels</h1>
            <div class="page-subtitle">Gerenciamento de canais Slack, Teams, Discord, Telegram e Webhooks</div>
        </div>
        <div class="header-actions">
            <button class="btn btn-secondary" onclick="loadAll()"><i class="fas fa-sync-alt"></i> Atualizar</button>
        </div>
    </header>

    <div class="panel">
        <div class="panel-header"><h3><i class="fas fa-plus"></i> Novo Canal</h3></div>
        <div class="panel-body">
            <div class="form-grid">
                <div class="form-group"><label>Nome</label><input id="c-name" placeholder="Ex: Slack NOC"></div>
                <div class="form-group"><label>Tipo</label><select id="c-type"><option value="slack">Slack</option><option value="teams">Teams</option><option value="discord">Discord</option><option value="telegram">Telegram</option><option value="webhook">Webhook</option></select></div>
                <div class="form-group"><label>URL</label><input id="c-url" placeholder="https://..."></div>
                <div class="form-group"><label>Chat ID (Telegram)</label><input id="c-chat" placeholder="Opcional"></div>
                <div class="form-group" style="grid-column:1/-1"><label>Eventos (csv)</label><input id="c-events" value="backup_failed,ransomware_detected,health_critical"></div>
                <div class="form-group" style="grid-column:1/-1"><label>Headers JSON (opcional)</label><textarea id="c-headers" rows="2" placeholder='{"Authorization":"Bearer ..."}'></textarea></div>
            </div>
            <button class="btn btn-primary" onclick="createChannel()"><i class="fas fa-save"></i> Criar Canal</button>
        </div>
    </div>

    <div class="panel">
        <div class="panel-header"><h3><i class="fas fa-list"></i> Canais Configurados</h3></div>
        <div class="panel-body" style="padding:0">
            <table class="tbl">
                <thead><tr><th>ID</th><th>Nome</th><th>Tipo</th><th>Status</th><th>Eventos</th><th>Ações</th></tr></thead>
                <tbody id="channels-table"><tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:20px">Carregando...</td></tr></tbody>
            </table>
        </div>
    </div>

    <div class="panel">
        <div class="panel-header"><h3><i class="fas fa-history"></i> Histórico de Notificações</h3></div>
        <div class="panel-body" style="padding:0">
            <table class="tbl">
                <thead><tr><th>Data</th><th>Canal</th><th>Evento</th><th>Status</th><th>Mensagem</th></tr></thead>
                <tbody id="hist-table"><tr><td colspan="5" style="text-align:center;color:var(--text-muted);padding:20px">Carregando...</td></tr></tbody>
            </table>
        </div>
    </div>
</main>
</div>
<script src="/static/sidebar.js"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{new UnifiedSidebar().initialize();loadAll()});
const API='/api/notification-channels';

async function loadAll(){ await Promise.allSettled([loadChannels(), loadHistory()]); }

async function loadChannels(){
  const r=await fetch(API+'/'); const d=await r.json(); const items=d.channels||[];
  const tb=document.getElementById('channels-table');
  if(!items.length){tb.innerHTML='<tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:20px">Sem canais</td></tr>';return}
  tb.innerHTML=items.map(x=>`<tr>
    <td>${x.id}</td><td><strong>${x.name||'—'}</strong></td><td>${(x.channel_type||x.type||'—').toUpperCase()}</td>
    <td><span class="${x.enabled?'badge-ok':'badge-warn'}">${x.enabled?'ATIVO':'INATIVO'}</span></td>
    <td style="max-width:260px;white-space:normal;word-break:break-word">${Array.isArray(x.events)?x.events.join(', '):x.events||'—'}</td>
    <td>
      <button class="btn btn-sm btn-secondary" onclick="testChannel(${x.id})"><i class="fas fa-vial"></i> Testar</button>
      <button class="btn btn-sm btn-danger" onclick="deleteChannel(${x.id})"><i class="fas fa-trash"></i></button>
    </td>
  </tr>`).join('');
}

async function createChannel(){
  const name=document.getElementById('c-name').value.trim();
  const channel_type=document.getElementById('c-type').value;
  const webhook_url=document.getElementById('c-url').value.trim();
  const chat_id=document.getElementById('c-chat').value.trim();
  const events=(document.getElementById('c-events').value||'').split(',').map(x=>x.trim()).filter(Boolean);
  const headersRaw=document.getElementById('c-headers').value.trim();
  if(!name||!webhook_url){alert('Nome e URL são obrigatórios');return}
  let custom_headers={};
  if(headersRaw){ try{ custom_headers=JSON.parse(headersRaw);}catch(e){alert('Headers JSON inválido');return} }
  const payload={name,channel_type,webhook_url,chat_id,events,custom_headers,enabled:true};
  const r=await fetch(API+'/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const d=await r.json();
  if(!r.ok){alert('Erro: '+(d.detail||'falha'));return}
  loadAll();
}

async function testChannel(id){
  const r=await fetch(`${API}/${id}/test`,{method:'POST'}); const d=await r.json();
  alert(d.message||JSON.stringify(d));
  loadHistory();
}

async function deleteChannel(id){ if(!confirm('Excluir canal?'))return; await fetch(`${API}/${id}`,{method:'DELETE'}); loadAll(); }

async function loadHistory(){
  const r=await fetch(API+'/history/all'); const d=await r.json(); const items=d.history||[];
  const tb=document.getElementById('hist-table');
  if(!items.length){tb.innerHTML='<tr><td colspan="5" style="text-align:center;color:var(--text-muted);padding:20px">Sem histórico</td></tr>';return}
  tb.innerHTML=items.map(x=>`<tr>
    <td>${x.created_at?gbocFormatDateTime(x.created_at):'—'}</td>
    <td>${x.channel_name||x.channel_id||'—'}</td>
    <td>${x.event_type||x.event||'—'}</td>
    <td><span class="${(x.status==='sent'||x.success)?'badge-ok':'badge-warn'}">${x.status||((x.success)?'sent':'failed')}</span></td>
    <td style="max-width:400px;white-space:normal;word-break:break-word">${x.error_message||x.message||'—'}</td>
  </tr>`).join('');
}
</script>
</body>
</html>
