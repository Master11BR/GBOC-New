<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GBOC Agent - Diagnóstico de Schema</title>
    <link rel="stylesheet" href="/static/style.css?v=13.2.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="/static/auth_interceptor.js"></script>
    <style>
        .health-score { font-size: 3em; font-weight: 700; margin: 20px 0; }
        .health-complete { color: var(--success); }
        .health-incomplete { color: var(--danger); }
        .table-status { display: grid; gap: 12px; margin-top: 20px; }
        .table-card { background: var(--bg-card); padding: 16px; border-radius: 8px; border: 1px solid var(--border); }
        .table-card.complete { border-left: 4px solid var(--success); }
        .table-card.incomplete { border-left: 4px solid var(--danger); }
        .table-name { font-weight: 700; font-size: 1.1em; margin-bottom: 8px; }
        .missing-list { background: rgba(240,107,107,.1); padding: 8px; border-radius: 4px; margin-top: 8px; font-family: monospace; font-size: 0.85em; }
        .recommendation { background: var(--bg-input); padding: 12px; border-radius: 6px; margin: 8px 0; display: flex; align-items: center; gap: 10px; }
        .recommendation i { color: var(--primary); width: 20px; }
    </style>
</head>
<body>
    <div class="app">
        <main class="main-content">
            <header class="header">
                <div>
                    <div class="breadcrumb"><a href="/">GBOC</a> / Sistema / Schema</div>
                    <h1 class="page-title">Diagnóstico de Schema do Banco</h1>
                    <div class="page-subtitle">Verificação de integridade estrutural das tabelas</div>
                </div>
                <div class="header-actions">
                    <a href="/diagnostic.html" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Diagnóstico</a>
                    <button class="btn btn-primary" onclick="checkSchema()"><i class="fas fa-sync-alt"></i> Verificar</button>
                    <button class="btn btn-warning" onclick="fixSchema()" id="btnFix" style="display:none;"><i class="fas fa-wrench"></i> Corrigir</button>
                </div>
            </header>

            <div class="content">
                <section class="panel">
                    <div class="panel-hdr"><h3><i class="fas fa-heartbeat"></i> Health Score do Schema</h3></div>
                    <div class="panel-body" style="text-align:center;">
                        <div class="health-score" id="healthScore">-</div>
                        <div id="healthStatus" style="font-size:1.2em;margin-bottom:20px;">Carregando...</div>
                    </div>
                </section>

                <section class="panel">
                    <div class="panel-hdr"><h3><i class="fas fa-database"></i> Status das Tabelas</h3></div>
                    <div class="panel-body">
                        <div class="table-status" id="tableStatus">Carregando...</div>
                    </div>
                </section>

                <section class="panel" id="recommendationsPanel" style="display:none;">
                    <div class="panel-hdr"><h3><i class="fas fa-lightbulb"></i> Recomendações</h3></div>
                    <div class="panel-body" id="recommendations"></div>
                </section>

                <section class="panel" id="detailsPanel" style="display:none;">
                    <div class="panel-hdr"><h3><i class="fas fa-info-circle"></i> Detalhes Técnicos</h3></div>
                    <div class="panel-body"><pre id="details" style="white-space:pre-wrap;margin:0;"></pre></div>
                </section>
            </div>
        </main>
    </div>

    <script>
    async function api(path, options={}) {
        const res = await fetch(path, {
            headers: { 'Content-Type': 'application/json' },
            ...options
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(JSON.stringify(data));
        return data;
    }

    async function checkSchema() {
        try {
            document.getElementById('healthScore').textContent = '...';
            document.getElementById('healthStatus').textContent = 'Verificando...';
            document.getElementById('tableStatus').innerHTML = 'Carregando...';

            const data = await api('/api/system/schema-check');
            
            // Health Score
            const score = data.schema_health || 0;
            const scoreEl = document.getElementById('healthScore');
            scoreEl.textContent = score + '%';
            scoreEl.className = 'health-score ' + (score === 100 ? 'health-complete' : 'health-incomplete');
            
            document.getElementById('healthStatus').textContent = data.health_status === 'complete' 
                ? '✅ Schema Completo' 
                : '⚠️ Schema Incompleto';

            // Tabelas
            const tables = data.tables || {};
            const missing = data.missing_columns || {};
            let html = '';

            for (const [tableName, info] of Object.entries(tables)) {
                const hasMissing = missing[tableName] && missing[tableName].length > 0;
                const cssClass = hasMissing ? 'incomplete' : 'complete';
                
                html += `<div class="table-card ${cssClass}">
                    <div class="table-name">${tableName}</div>
                    <div>Total: ${info.total_columns} / ${info.expected_columns} colunas</div>`;
                
                if (hasMissing) {
                    html += `<div class="missing-list">❌ Faltando (${missing[tableName].length}): ${missing[tableName].join(', ')}</div>`;
                }
                
                html += `</div>`;
            }

            document.getElementById('tableStatus').innerHTML = html;

            // Recomendações
            if (data.recommendations && data.recommendations.length > 0) {
                const recPanel = document.getElementById('recommendationsPanel');
                recPanel.style.display = 'block';
                
                let recHtml = '';
                for (const rec of data.recommendations) {
                    const icon = rec.startsWith('✅') ? 'fa-check-circle' : 
                                 rec.startsWith('⚠️') ? 'fa-exclamation-triangle' : 
                                 'fa-wrench';
                    recHtml += `<div class="recommendation"><i class="fas ${icon}"></i><span>${rec}</span></div>`;
                }
                document.getElementById('recommendations').innerHTML = recHtml;
            }

            // Mostrar botão de correção se houver problemas
            if (score < 100) {
                document.getElementById('btnFix').style.display = 'inline-block';
            }

            // Detalhes
            document.getElementById('detailsPanel').style.display = 'block';
            document.getElementById('details').textContent = JSON.stringify(data, null, 2);

        } catch (e) {
            document.getElementById('healthStatus').textContent = 'Erro: ' + e.message;
            document.getElementById('tableStatus').innerHTML = '<div style="color:var(--danger);">Erro ao verificar schema</div>';
        }
    }

    async function fixSchema() {
        if (!confirm('Deseja aplicar as correções automáticas de schema?\n\nIsso irá adicionar colunas faltantes nas tabelas.')) {
            return;
        }

        try {
            document.getElementById('healthStatus').textContent = 'Aplicando correções...';
            const data = await api('/api/system/schema-fix', { method: 'POST' });
            
            alert(`Correções aplicadas com sucesso!\n\n${data.total_fixes} coluna(s) adicionada(s):\n${data.fixes_applied.join('\n')}`);
            
            // Re-verificar
            await checkSchema();

        } catch (e) {
            alert('Erro ao corrigir schema: ' + e.message);
        }
    }

    // Auto-load
    checkSchema();
    </script>
<script src="/static/sidebar.js"></script>
</body>
</html>
