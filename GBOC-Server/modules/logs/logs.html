<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logs Globais - GBOC Server</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/gboc-themes.css">
    <link rel="stylesheet" href="/static/gboc-layout.css">
    <script src="/static/gboc-layout-manager.js"></script>
    <script src="/modules/logs/logs.js"></script>
</head>
<body class="layout-vertical">
    <main class="main-content" style="padding:24px">
        <h2 style="font-size:1.4em;margin-bottom:20px;display:flex;align-items:center;gap:10px">
            <i class="fas fa-terminal" style="color:var(--primary)"></i> Logs Globais do Sistema &amp; Agentes
        </h2>
        <div class="panel" style="background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:24px">
            <div style="display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap">
                <select id="log-level" style="padding:8px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg-input);color:var(--text)">
                    <option value="">Todos os Níveis</option>
                    <option value="ERROR">Apenas Erros (ERROR)</option>
                    <option value="WARNING">Avisos (WARNING)</option>
                    <option value="INFO">Informação (INFO)</option>
                </select>
                <input type="text" id="log-search" placeholder="Buscar nos logs..." style="padding:8px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg-input);color:var(--text);flex:1">
                <button class="btn btn-primary" onclick="loadLogsData()"><i class="fas fa-search"></i> Filtrar</button>
            </div>
            <table class="data-table" style="width:100%">
                <thead>
                    <tr>
                        <th>Nível</th>
                        <th>Agente</th>
                        <th>Fonte</th>
                        <th>Mensagem</th>
                        <th>Timestamp</th>
                    </tr>
                </thead>
                <tbody id="table-logs">
                    <tr><td colspan="5" style="text-align:center;color:var(--text-muted)">Carregando logs do sistema...</td></tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
