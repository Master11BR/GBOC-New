<!-- GBOC System v13.2.0 Enterprise Edition -->
<!-- Module: RMM & Remote Terminal Template Fragment -->

<div class="panel">
    <h3><i class="fas fa-terminal" style="color:var(--primary);margin-right:8px"></i> RMM - Terminal Remoto & Gerenciador de Sistema</h3>
    <div style="display:flex;gap:12px;margin-bottom:16px;align-items:center;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:6px">
            <label for="rmm-agent-select" style="font-weight:600;font-size:0.85em;color:var(--text-muted);white-space:nowrap"><i class="fas fa-server"></i> Agente Alvo:</label>
            <select id="rmm-agent-select" class="form-control" style="background:var(--bg-input);color:var(--text);padding:8px 12px;border-radius:6px;min-width:220px" onchange="loadRMMProcesses()">
                <option value="agente-local">🖥️ Agente Local (Servidor Host)</option>
            </select>
        </div>
        <input type="text" id="rmm-cmd-input" class="form-control" style="flex:1;background:#1e1e1e;color:#00ff66;font-family:monospace;padding:10px;min-width:240px" placeholder="Digite um comando PowerShell / CMD (Ex: Get-Process | Select -First 10)..." onkeydown="if(event.key==='Enter') runRMMCommand()">
        <button class="btn btn-primary" onclick="runRMMCommand()"><i class="fas fa-paper-plane"></i> Executar</button>
        <button class="btn btn-warning" onclick="loadRMMProcesses()"><i class="fas fa-tasks"></i> Processos</button>
        <button class="btn btn-danger" onclick="toggleRMMIsolation()"><i class="fas fa-network-wired"></i> Isolamento de Rede</button>
    </div>
    <div style="background:#0d1117;color:#00ff66;font-family:monospace;padding:16px;border-radius:8px;min-height:220px;max-height:400px;overflow-y:auto;white-space:pre-wrap" id="rmm-terminal-output">> GBOC RMM Remote Terminal v13.2.0 Ready. Digite um comando para executar no agente nativo.</div>
</div>
<div class="panel" style="margin-top:16px">
    <h3><i class="fas fa-microchip" style="color:var(--success)"></i> Processos em Tempo Real (Top RAM/CPU)</h3>
    <table class="data-table">
        <thead><tr><th>PID</th><th>Nome do Processo</th><th>CPU (%)</th><th>Memória (MB)</th><th>Usuário</th><th>Ação</th></tr></thead>
        <tbody id="rmm-process-table"><tr><td colspan="6" style="text-align:center;color:var(--text-muted)">Clique em 'Processos' para listar.</td></tr></tbody>
    </table>
</div>
