<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GBOC AI Copilot - GBOC Server</title>
    
    
    <link rel="stylesheet" href="/static/vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="/static/ui/design-system/tokens.css?v=14.8.1">
    <link rel="stylesheet" href="/static/ui/design-system/unocss-ds.css?v=14.8.1">
    <link rel="stylesheet" href="/static/ui/models/modern/model.css?v=14.8.1">
    <link rel="stylesheet" href="/static/ui/models/modern/components.css?v=14.8.1">
    <link rel="stylesheet" href="/static/ui/models/modern/layout.css?v=14.8.1">
    <link rel="stylesheet" href="/static/style.css?v=14.8.1">
    <link rel="stylesheet" href="/static/gboc-themes.css?v=14.8.1">
    <link rel="stylesheet" href="/static/gboc-layout.css?v=14.8.1">
    <script src="/static/gboc-perf.js?v=14.8.1"></script>
    <script src="/static/gboc-layout-manager.js?v=14.8.1"></script>
    <script src="/static/gboc-modal.js?v=14.8.1"></script>
<style>
        .ai-page { padding: 24px; }
        .ai-page-title { font-size: 1.4em; margin-block-end: 20px; display: flex; align-items: center; gap: 10px; }
        .ai-page-title i { color: var(--primary); }
        .ai-page-panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--card-radius, 12px); padding: 24px; }
        .ai-page-output { background: var(--bg-input); padding: 16px; border-radius: 8px; min-block-size: 250px; max-block-size: 450px; overflow: auto; margin-block-end: 16px; }
        .ai-page-msg { margin-block: 10px; line-height: 1.45; }
        .ai-page-user { text-align: end; }
        .ai-page-err { color: var(--danger); }
        .ai-page-bot { color: var(--text); }
        .ai-page-form { display: flex; gap: 10px; }
        .ai-page-form input { flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-input); color: var(--text); }
        .sr-only { position: absolute; inline-size: 1px; block-size: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    </style>
    <script src="/modules/ai_assistant/ai_assistant.js" defer></script>
</head>
<body class="layout-vertical">
    <main class="main-content ai-page">
        <h2 class="ai-page-title">
            <i class="fas fa-brain" aria-hidden="true"></i> GBOC Server AI Copilot (IA Generativa)
        </h2>
        <section class="panel ai-page-panel" aria-label="Conversa com o Copilot">
            <div id="ai-page-output" class="ai-page-output" aria-live="polite">
                <p class="ai-page-msg ai-page-bot">🤖 <strong>GBOC AI Copilot:</strong> Olá! Como posso auxiliar na gestão de backups, diagnósticos e orquestração do Servidor Central hoje?</p>
            </div>
            <form id="ai-page-form" class="ai-page-form">
                <label for="ai-page-input" class="sr-only">Pergunta para o Copilot</label>
                <input type="text" id="ai-page-input" maxlength="8000" autocomplete="off" placeholder="Pergunte ao GBOC Copilot...">
                <button type="submit" id="ai-page-send" class="btn btn-primary"><i class="fas fa-paper-plane" aria-hidden="true"></i> Enviar</button>
            </form>
        </section>
    </main>
</body>
</html>
